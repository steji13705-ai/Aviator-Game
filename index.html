<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Game</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
        }
        .balance-box {
            font-size: 20px;
            margin-bottom: 20px;
            color: #ffd700;
        }
        .game-card {
            background: #000;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        #multiplier {
            font-size: 48px;
            font-weight: bold;
            color: #ffffff;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        input[type="number"] {
            padding: 10px;
            font-size: 16px;
            width: 80px;
            border-radius: 5px;
            border: none;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-bet { background-color: #28a745; color: white; }
        .btn-cashout { background-color: #dc3545; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <div class="balance-box" id="balance">Balance: $1000.00</div>
        
        <div class="game-card">
            <h1 id="multiplier">1.00x</h1>
        </div>

        <div class="controls">
            <input type="number" id="betAmount" value="10" min="1">
            <button class="btn-bet" onclick="startGame()">Bet & Start</button>
            <button class="btn-cashout" onclick="cashOut()">Cash Out</button>
        </div>
    </div>

    <!-- Socket.io Library Included First -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
