<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Pro Game</title>
    <style>
        body {
            background-color: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }

        .wallet-container {
            background-color: #161b22;
            padding: 10px 25px;
            border-radius: 8px;
            border: 1px solid #30363d;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        .balance-val { color: #2ea44f; }

        /* History Multipliers Bar */
        .history-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 920px;
            overflow-x: auto;
            padding: 5px 0;
        }
        .history-tag {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            background-color: #21262d;
        }
        .tag-low { color: #388bfd; border: 1px solid #388bfd; }
        .tag-high { color: #a371f7; border: 1px solid #a371f7; }

        /* Layout */
        .main-layout { display: flex; gap: 20px; max-width: 920px; width: 100%; }

        /* Bets Panel */
        .live-bets-panel {
            width: 280px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px;
            box-sizing: border-box;
        }
        .bets-list { list-style: none; padding: 0; margin: 0; max-height: 340px; overflow-y: auto; }
        .bet-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 8px;
            border-bottom: 1px solid #21262d;
            font-size: 13px;
            border-radius: 4px;
            margin-bottom: 4px;
            background-color: #0d1117;
        }
        .bet-item.cashed-out { background-color: rgba(46, 164, 79, 0.15); border-left: 3px solid #2ea44f; }

        /* Canvas Panel */
        .game-container {
            position: relative;
            width: 600px;
            height: 320px;
            border: 2px solid #30363d;
            border-radius: 10px;
            background-color: #161b22;
            overflow: hidden;
        }
        canvas { width: 100%; height: 100%; }

        .multiplier {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 42px;
            font-weight: bold;
            color: white;
            text-align: center;
        }

        /* Controls */
        .controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            background-color: #161b22;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            width: 600px;
            box-sizing: border-box;
        }
        .input-group { display: flex; flex-direction: column; gap: 2px; }
        .input-group label { font-size: 11px; color: #8b949e; }
        input {
            padding: 6px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: white;
            width: 75px;
        }
        button {
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        #start-btn { background-color: #238636; color: white; }
        #cashout-btn { background-color: #da3633; color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="wallet-container">🪙 Balance: <span id="balance" class="balance-val">$1000</span></div>

    <!-- Multipliers History Bar -->
    <div id="history-bar" class="history-bar"></div>

    <div class="main-layout">
        <div class="live-bets-panel">
            <h4 style="margin:0 0 10px 0; color:#8b949e;">Live Bets (<span id="active-players-count">0</span>)</h4>
            <ul id="bets-list" class="bets-list"></ul>
        </div>

        <div>
            <div class="game-container">
                <canvas id="gameCanvas"></canvas>
                <div id="multiplier" class="multiplier">1.00x</div>
            </div>

            <div class="controls">
                <div class="input-group">
                    <label>Name:</label>
                    <input type="text" id="player-name" value="Player1">
                </div>
                <div class="input-group">
                    <label>Bet ($):</label>
                    <input type="number" id="bet-amount" value="10">
                </div>
                <div class="input-group">
                    <label>Auto Cash:</label>
                    <input type="number" id="auto-cashout" value="2.00" step="0.1">
                </div>
                <button id="start-btn" onclick="startGame()">Bet & Start</button>
                <button id="cashout-btn" onclick="cashOut()" disabled>Cash Out</button>
            </div>
        </div>
    </div>

    <!-- Audio Effects -->
    <audio id="fly-sound" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" loop></audio>
    <audio id="win-sound" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>
    <audio id="crash-sound" src="https://assets.mixkit.co/active_storage/sfx/254/254-preview.mp3"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
